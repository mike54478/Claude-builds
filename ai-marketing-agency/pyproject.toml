[project]
name = "ai-marketing-agency"
version = "0.1.0"
description = "Autonomous AI marketing agency — agent runtime scaffolding"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.69", "pydantic>=2.7", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
